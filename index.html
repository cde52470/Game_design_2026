<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diamond Road - 棒球生涯原型</title>
    <meta
      name="description"
      content="一款年度回合制棒球人生模擬器：讀懂天賦、分配成長、面對事件，讓同一名球員走出不同職涯。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="start-panel" id="startPanel">
        <div class="brand-block">
          <p class="eyebrow">Baseball Career Simulator</p>
          <h1>Diamond Road</h1>
          <p class="intro">
            每一年只做少數關鍵選擇。讀懂天賦、分配成長，讓同一名球員在不同路線中長成不同版本的自己。
          </p>
        </div>

        <form class="creator" id="creatorForm">
          <label>
            <span>球員姓名</span>
            <input id="playerName" maxlength="12" placeholder="例如：林一翔" autocomplete="off" />
          </label>
          <label>
            <span>背號</span>
            <input id="playerNumber" type="number" min="0" max="99" value="18" />
          </label>

          <fieldset>
            <legend>守備位置</legend>
            <div class="position-grid" id="positionGrid">
              <button type="button" class="selected" data-position="pitcher">投手</button>
              <button type="button" data-position="catcher">捕手</button>
              <button type="button" data-position="infielder">內野手</button>
              <button type="button" data-position="outfielder">外野手</button>
            </div>
          </fieldset>

          <label>
            <span>世界種子</span>
            <div class="seed-row">
              <input id="seedInput" maxlength="14" autocomplete="off" />
              <button type="button" id="randomSeed" aria-label="產生新種子">換</button>
            </div>
          </label>

          <button class="primary" type="submit">開始這段棒球人生</button>
        </form>
      </section>

      <section class="game-panel hidden" id="gamePanel">
        <header class="scoreboard">
          <div>
            <p class="eyebrow" id="yearLabel">2026 年・16 歲・高一</p>
            <h2 id="playerTitle">NO.18 球員</h2>
          </div>
          <div class="quick-stats">
            <span><b id="overall">0</b>綜合</span>
            <span><b id="level">高中</b>層級</span>
            <span class="arm-stat hidden" id="armStat"><b id="armLabel">輕鬆</b>肩肘</span>
          </div>
        </header>

        <section class="game-feed" id="gameFeed" aria-label="年度事件紀錄"></section>

        <section class="control-dock" id="controlDock">
          <div class="control-head">
            <div>
              <p class="phase-title" id="phaseTitle">年度成長</p>
              <h3 id="storyTitle">開年成長骰</h3>
              <p id="storyText">
                系統會給出今年的成長骰。骰子是年度資源，玩家要決定如何投入能力。
              </p>
            </div>
            <div class="control-tools">
              <button id="dockToggle" type="button" aria-expanded="true">收合</button>
              <button id="resetGame" type="button">重來</button>
            </div>
          </div>

          <div class="control-body" id="controlBody">
            <div class="dice-panel hidden" id="dicePanel"></div>
            <div class="stats-list hidden" id="statsList"></div>
            <div class="stats-actions hidden" id="statsActions"></div>
            <div class="actions" id="actions"></div>
            <div class="result-box hidden" id="resultBox"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
